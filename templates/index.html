<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YDD Downloader</title>
  <style>
    :root { --bg:#0f172a; --panel:#0b1220; --txt:#e2e8f0; --muted:#94a3b8; --brand:#14b8a6; --danger:#ef4444; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b1020,#0f172a);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu}
    .wrap{max-width:920px;margin:48px auto;padding:0 16px}
    .card{background:radial-gradient(1200px 700px at 10% 0%,#0e1930 0%,#0b1220 35%,#0a1020 100%);border:1px solid rgba(148,163,184,.12);border-radius:18px;box-shadow:0 10px 40px rgba(2,6,23,.35);padding:24px}
    h1{margin:0 0 8px;font-weight:800;letter-spacing:.2px} .sub{color:var(--muted);margin-bottom:16px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    input,select,button{height:44px;border-radius:10px;border:1px solid rgba(148,163,184,.18);background:#0c1526;color:var(--txt);padding:0 12px}
    input{flex:1;min-width:240px} select{width:120px}
    button{background:var(--brand);border:none;color:#062a27;font-weight:700;padding:0 18px;cursor:pointer}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .bar{height:8px;background:#101a2e;border-radius:999px;overflow:hidden;margin:14px 0 6px}
    .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#14b8a6)}
    .muted{color:var(--muted);font-size:.92rem}
    .error{color:var(--danger);white-space:pre-wrap}
    .history{margin-top:18px}
    .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed rgba(148,163,184,.18)}
    .badge{font-size:.74rem;background:#0f1b31;border:1px solid rgba(148,163,184,.18);padding:4px 8px;border-radius:999px;color:#93c5fd}
    a.dl{color:#22d3ee;text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="badge">YDD Downloader</div>
      <h1>Audio & Vidéo multi-plateformes</h1>
      <div class="sub">Colle un lien (YouTube, Instagram, TikTok, Facebook), choisis <b>Audio</b> ou <b>Vidéo</b>, puis clique <b>Download</b>.</div>

      <div class="row">
        <input id="url" placeholder="https://..." spellcheck="false" />
        <select id="mode">
          <option value="video" selected>Vidéo</option>
          <option value="audio">Audio</option>
        </select>
        <button id="go">Download</button>
      </div>

      <div class="bar"><i id="bar"></i></div>
      <div class="row" style="justify-content:space-between">
        <div class="muted"><span id="status">0%</span></div>
        <div class="muted"><span id="speed"></span></div>
      </div>

      <div id="msg" class="error"></div>

      <div class="history" id="history"></div>

      <div class="muted" style="margin-top:14px">
        Astuce : si YouTube/Instagram demandent une connexion, configure <code>COOKIES_B64</code> côté serveur (cookies Netscape encodés Base64).
      </div>
    </div>
  </div>

  <script>
    const urlEl    = document.getElementById('url');
    const goEl     = document.getElementById('go');
    const barEl    = document.getElementById('bar');
    const statusEl = document.getElementById('status');
    const speedEl  = document.getElementById('speed');
    const histEl   = document.getElementById('history');
    const modeEl   = document.getElementById('mode');

    function setProgress(pct, text, speed){
      barEl.style.width = (pct || 0) + '%';
      statusEl.textContent = (pct || 0) + '% ' + (text || '');
      speedEl.textContent = speed || '';
    }

    function addHistory(entry){
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = '<span class="badge">'+ entry.mode +'</span><span class="muted" style="flex:1">'+ entry.url +'</span>' +
                    (entry.href ? '<a class="dl" href="'+ entry.href +'">Télécharger</a>' : '');
      histEl.prepend(d);
    }

    async function poll(job){
      let lastPct = 0;
      while (true){
        const r = await fetch('/api/status/' + job);
        const s = await r.json();
        if (s.status === 'downloading'){
          lastPct = Math.max(lastPct, Math.round(s.pct || 0));
          setProgress(lastPct, s.text || 'Téléchargement', s.speed || '');
        } else if (s.status === 'finished'){
          setProgress(100, 'Terminé', '');
          addHistory({ url: s.url, mode: s.mode, href: '/result/' + job });
          // auto-téléchargement
          window.location.href = '/result/' + job;
          break;
        } else if (s.status === 'error'){
          document.getElementById('msg').textContent = s.message || 'Erreur.';
          setProgress(0, 'Erreur', '');
          break;
        } else {
          // unknown / queued
          setProgress(lastPct, 'Préparation', '');
        }
        await new Promise(t => setTimeout(t, 1000));
      }
    }

    async function startDownload(){
      document.getElementById('msg').textContent = '';
      setProgress(0, 'Préparation', '');
      goEl.disabled = true;
      try{
        const body = { url: urlEl.value.trim(), mode: modeEl.value };
        const r = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const j = await r.json();
        if (!r.ok){ throw new Error(j.error || 'Erreur serveur'); }
        addHistory({ url: body.url, mode: body.mode, href: '' });
        poll(j.job_id);
      }catch(e){
        document.getElementById('msg').textContent = String(e);
        goEl.disabled = false;
        setProgress(0, 'Erreur', '');
      }finally{
        // re-active quand le polling finira
        setTimeout(() => { goEl.disabled = false; }, 1500);
      }
    }

    goEl.addEventListener('click', startDownload);
    urlEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ startDownload(); }});
  </script>
</body>
</html>
